[package]
name = "zakuro-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
opengl = ["dep:glow"]
vulkan = ["dep:ash", "dep:ash-window", "dep:naga"]

[dependencies]
zakuro-common.workspace = true
log.workspace = true
bitflags.workspace = true
thiserror.workspace = true
rayon.workspace = true
wide = "1.7"
raw-window-handle = "0.6"

glow = { version = "0.16", optional = true }
ash = { version = "0.38", optional = true, default-features = false, features = ["loaded", "std"] }
ash-window = { version = "0.13", optional = true }
# turns translated vertex shaders into SPIR-V. wgsl-in only so 30.0.1 builds,
# its glsl-in needs code it gates on wgsl-in
naga = { version = "30.0.1", optional = true, features = ["glsl-in", "wgsl-in", "spv-out"] }
